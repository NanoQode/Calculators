# /etc/nginx/sites-available/instasure.ca (as running in production since October 3, 2026)
# instasure.ca: Node app on 127.0.0.1:3330 (systemd unit: instasure, code: /srv/instasure/current,
# data: /var/lib/instasure, settings: /etc/instasure/instasure.env, log: /var/log/instasure.log).
# One canonical origin: https://instasure.ca. http:// and www. reach it in a single 301.
# The app sets its own security headers (CSP with nonces, HSTS) and compression.

server {
    listen 80;
    listen [::]:80;
    server_name instasure.ca www.instasure.ca;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://instasure.ca$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.instasure.ca;
    ssl_certificate     /etc/letsencrypt/live/instasure.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instasure.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://instasure.ca$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name instasure.ca;
    ssl_certificate     /etc/letsencrypt/live/instasure.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/instasure.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/instasure.access.log;
    error_log  /var/log/nginx/instasure.error.log;

    client_max_body_size 12m;   # media library and advisor photo uploads

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }

    location / {
        proxy_pass http://127.0.0.1:3330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
