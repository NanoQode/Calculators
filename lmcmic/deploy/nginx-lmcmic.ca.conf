# lmcmic.ca — Lendmax Capital MIC investor site
#
# One canonical origin: https://lmcmic.ca with trailing-slash directory URLs.
# Everything else (http://, www., /index.html, legacy WordPress / funnel paths)
# reaches it in a single 301, so search engines see one URL per page.
#
# TLS: until DNS points here the self-signed snakeoil pair is used so nginx can
# load. /usr/local/sbin/lmcmic-cert swaps in the Let's Encrypt certificate the
# moment lmcmic.ca resolves to this server (cron, every 5 minutes).

map $http_cf_connecting_ip $lmcmic_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    listen [::]:80;
    server_name lmcmic.ca www.lmcmic.ca;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }
    location / { return 301 https://lmcmic.ca$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.lmcmic.ca;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;      # LMCMIC_CERT
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;    # LMCMIC_KEY
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://lmcmic.ca$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lmcmic.ca;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;      # LMCMIC_CERT
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;    # LMCMIC_KEY
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_lmcmic:10m;
    ssl_session_timeout 1d;

    root /var/www/lmcmic.ca/current;
    index index.html;
    charset utf-8;
    absolute_redirect off;          # directory redirects stay on https://lmcmic.ca

    access_log /var/log/nginx/lmcmic.access.log;
    error_log  /var/log/nginx/lmcmic.error.log;

    # add_header Strict-Transport-Security "max-age=31536000" always;   # LMCMIC_HSTS
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com https://www.google-analytics.com; frame-src https://www.youtube-nocookie.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- canonical URL hygiene
    location = /index.html { return 301 /; }
    location ~ ^(?<dir>/.+/)index\.html$ { return 301 $dir; }

    # ---- legacy URLs from the previous WordPress / funnel site
    location ~* ^/(home|homepage|index\.php)/?$                         { return 301 /; }
    location ~* ^/(about|about-us|our-team|team|who-we-are)/?$          { return 301 /why-invest-in-a-mic/; }
    location ~* ^/(contact|contact-us|get-started|start|talk-to-an-advisor|book|apply|invest-now|start-investing)/?$ { return 301 /contact/; }
    location ~* ^/(invest|investors?|how-it-works|how-to-invest|process)/?$ { return 301 /how-to-invest/; }
    location ~* ^/(faq|faqs|questions)/?$                               { return 301 /faq/; }
    location ~* ^/(blog|news|articles|resources|education)/?$           { return 301 /learn/; }
    location ~* ^/(performance|returns|track-record|risk)/?$            { return 301 /performance-and-risk/; }
    location ~* ^/(what-is-a-mic|mic|why-mic|why-invest)/?$             { return 301 /why-invest-in-a-mic/; }
    location ~* ^/(privacy|privacy-policy)/?$                           { return 301 /privacy/; }
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-content|wp-includes|wp-json)(/|$) { return 410; }

    # ---- lead endpoint (Node, 127.0.0.1:3310)
    location /api/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3310;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $lmcmic_client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 20s;
    }

    # ---- static
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location ~* \.(ico|png|webmanifest)$ { expires 7d; try_files $uri =404; }
    location ~* \.(xml|txt)$ { expires 1h; try_files $uri =404; }

    location / {
        expires 10m;
        try_files $uri $uri/ =404;
    }
}
